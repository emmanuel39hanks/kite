[package]
name = "kite-factory"
version = "0.1.0"
edition = "2021"
description = "Kite vault factory: creates <name>.<factory> vaults running the Kite vault code compiled into it, owned by whoever calls it, such as a DAO."
license = "MIT"
repository = "https://github.com/emmanuel39hanks/kite"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
