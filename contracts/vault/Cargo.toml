[package]
name = "kite-vault"
version = "0.1.0"
edition = "2021"
description = "Kite vault: a per-user NEAR contract that holds a portfolio in NEAR Intents and lets an agent only rebalance inside the owner's plan."
license = "MIT"
repository = "https://github.com/emmanuel39hanks/kite"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
ed25519-dalek = "2"
