[package]
name = "kite-integration-tests"
version = "0.1.0"
edition = "2021"
description = "Runs the shipped vault wasm on a local NEAR sandbox with real keys, real receipts and a mock intents.near."
license = "MIT"
publish = false

[dev-dependencies]
near-workspaces = "0.24"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
ed25519-dalek = "2"
sha2 = "0.10"
bs58 = "0.5"
